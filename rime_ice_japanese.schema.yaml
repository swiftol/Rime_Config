# Rime schema
# encoding: utf-8

# 雾凇拼音 + 日文混输方案
schema:
  schema_id: rime_ice_japanese
  name: 雾凇拼音·中日混输
  version: "1.6"
  author:
    - Dvel (雾凇拼音)
    - Kiro AI (中日混输)
  description: |
    雾凇拼音 + 日文混输
    中文拼音和日文罗马字无缝混输
  dependencies:
    - melt_eng
    - radical_pinyin
    - japanese
    - japanese_fuzzy_sokuon
    - japanese_fuzzy_long_i
    - japanese_fuzzy_long_u
    - japanese_fuzzy_long_mark
    - japanese_fuzzy_chi_ji
    - japanese_fuzzy_dakuten

# 开关
switches:
  - name: ascii_mode
    states: [ 中, Ａ ]
  - name: ascii_punct
    states: [ ¥, $ ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    states: [ 💀, 😄 ]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: show_english_annotation
    states: [ 英关, 英注 ]
  - name: show_japanese_annotation
    states: [ 日关, 日注 ]

# 输入引擎
  - name: japanese_fuzzy_match
    states: [ JP-exact, JP-fuzzy ]
    reset: 0
  - name: japanese_fuzzy_sokuon
    states: [ 促音关, 促音开 ]
  - name: japanese_fuzzy_long_i
    states: [ 长い关, 长い开 ]
  - name: japanese_fuzzy_long_u
    states: [ 长う关, 长う开 ]
  - name: japanese_fuzzy_long_mark
    states: [ 长ー关, 长ー开 ]
  - name: japanese_fuzzy_chi_ji
    states: [ ちじ关, ちじ开 ]
  - name: japanese_fuzzy_hu_fu
    states: [ hufu关, hufu开 ]
  - name: japanese_fuzzy_shu_sho
    states: [ shusho关, shusho开 ]
  - name: japanese_fuzzy_dakuten
    states: [ 浊音关, 浊音开 ]
  - name: japanese_fuzzy_sei_sai
    states: [ seisai关, seisai开 ]
    reset: 1
  - name: sentence_translation
    states: [ 句译关, 句译开 ]
    reset: 0

engine:
  processors:
    - lua_processor@space_commit_raw_processor  # 可切换“原文+空格”或“选择首选”（必须放在最前面）
    - lua_processor@*japanese_fuzzy_learning_processor
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@radical_lookup
    - punct_segmentor
    - fallback_segmentor
  translators:
    # 常用语先于普通中日词库产生候选，避免 aa 等冲突编码被挤到后页。
    - punct_translator
    - script_translator@chinese_exact_translator
    - script_translator@japanese_translator  # 日文精确匹配
    - lua_translator@*japanese_prefix_translator  # 至少 3 字母的日文前缀联想
    # All fuzzy rules share one prism lookup.  The Lua filter below applies
    # the master/child switches.  Five independent 48-57 MB lookups here
    # made every keystroke and Backspace rebuild the candidate list slowly.
    - lua_translator@*japanese_fuzzy_translator
    - script_translator              # 中文拼接、整句和预测候选
    - lua_translator@*date_translator
    - lua_translator@*lunar
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@radical_lookup
    - lua_translator@*unicode
    - lua_translator@*number_translator
    - lua_translator@*calc_translator
  filters:
    - lua_filter@*corrector
    - reverse_lookup_filter@radical_reverse_lookup
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*pin_cand_filter
    - lua_filter@*long_word_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - lua_filter@*search@radical_pinyin
    - lua_filter@*rare_single_char_filter
    - lua_filter@translation_annotation_filter
    # Ordering must be last: earlier ranking filters otherwise undo the
    # exact/fuzzy/assembled buckets produced here.
    - lua_filter@japanese_fuzzy_filter
    - uniquifier

space_commit_raw:
  select_first: false

# Lua 配置（继承雾凇拼音）
date_translator:
  date: rq
  time: sj
  week: xq
  datetime: dt
  timestamp: ts
  datezh: rqzh
  dateen: rqen

lunar: nl
lunar_template: "{干支年}{生肖}年{俗称农历月}{农历日}"

uuid: uuid

long_word_filter:
  count: 2
  idx: 4

reduce_english_filter:
  mode: custom
  idx: 2
  words: [
    aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf, bus, bach, bench, bush, bog,
    cab, cad, cain, cam, cans, cap, cef, chad, chan, chap, chef, cher, chew, chic, chime, chin, chip, chit, coup, cum, cunt, cur, couch,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn, don,
    fab, fax, fob, fog, foul, fur, fend,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hex, hud, hum, hung, hunk, hut, hush,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lichen, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux, lash, loch, lush,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, mesh,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut, nail, nash,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, posh, pot, pour, pow, pub, pinch, pouch,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs, ranch,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
    tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
    wag, wand, womens, wap, wax, weir, won, went,
    yan, yen,
    zach
  ]

rare_single_char_filter:
  # 隐藏 8105 字表中频次低于此值的中文单字；多字词不受影响。
  frequency_threshold: 4000

pin_cand_filter:
  - d	的
  - de	的 地 得
  - m	吗 嘛
  - hm	后面

# 主翻译器：中文拼音
translator:
  dictionary: rime_ice
  # 开发方案使用独立棱镜，不能复用可能被其他方案旧规则覆盖的 rime_ice.prism。
  prism: rime_ice_japanese_chinese_exact
  # 中日混输中禁止把无效/未完成的拼音自动补成另一音节。
  # 例如 sho 不应补成 shou 并产生“手、受、收”等中文候选。
  enable_completion: false
  enable_word_completion: false
  strict_spelling: true
  spelling_hints: 0
  always_show_comments: false
  initial_quality: 1.2
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])v/$1v/
    - xform/([nl])ue/$1ve/
    - xform/(?<=[A-Z])\s(?=[A-Z])//

# 日文翻译器
chinese_exact_translator:
  dictionary: rime_ice
  prism: rime_ice_japanese_chinese_exact
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  strict_spelling: true
  enable_user_dict: true
  spelling_hints: 0
  always_show_comments: false
  initial_quality: 300
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])v/$1v/
    - xform/([nl])ue/$1ve/
    - xform/(?<=[A-Z])\s(?=[A-Z])//

japanese_translator:
  dictionary: japanese
  enable_sentence: false
  enable_user_dict: true
  # 跨语言固定顺序：中文精确 1.2 > 日语精确 1.1 > 日语模糊 1.0。
  # Keep exact Japanese above fuzzy/assembled results, but allow an unfinished
  # romanization such as "sud" to show Japanese prefix candidates.  The final
  # ranking filter places candidate type "completion" in the last bucket.
  enable_completion: true
  enable_word_completion: true
  initial_quality: 200
  preedit_format:
    - 'xlit|q|ー|'
  comment_format:
    - 'xlit|q|ー|'

# 次翻译器：英文
japanese_fuzzy_translator:
  dictionary: japanese
  prism: japanese_fuzzy
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:COMBINED]/

japanese_fuzzy_sokuon_translator:
  dictionary: japanese
  prism: japanese_fuzzy_sokuon
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:SOKUON]/

japanese_fuzzy_long_i_translator:
  dictionary: japanese
  prism: japanese_fuzzy_long_i
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:LONG_I]/

japanese_fuzzy_long_u_translator:
  dictionary: japanese
  prism: japanese_fuzzy_long_u
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:LONG_U]/

japanese_fuzzy_long_mark_translator:
  dictionary: japanese
  prism: japanese_fuzzy_long_mark
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:LONG_MARK]/

japanese_fuzzy_chi_ji_translator:
  dictionary: japanese
  prism: japanese_fuzzy_chi_ji
  enable_sentence: false
  enable_completion: false
  enable_word_completion: false
  enable_user_dict: false
  initial_quality: 100
  spelling_hints: 100
  comment_format:
    - xform/^/[JF:CHI_JI]/

melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 中英混合词汇
cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

# 自定义短语
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

# Emoji
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

# 简繁切换
traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none
  tags: [ abc, number, gregorian_to_lunar ]

# 标点符号
punctuator:
  __include: default:/punctuator
  full_shape:
    __include: default:/punctuator/full_shape
  half_shape:
    __include: default:/punctuator/half_shape
  symbols:
    __include: symbols_v:/symbols

# 部件拆字反查
radical_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  enable_user_dict: false
  prefix: "uU"
  tips: "  〔拆字〕"
  comment_format:
    - erase/^.*$//

radical_reverse_lookup:
  tags: [ radical_lookup ]
  dictionary: rime_ice

# 处理符合特定规则的输入码
recognizer:
  import_preset: default
  patterns:
    punct: "^v([0-9]|10|[A-Za-z]+)$"
    radical_lookup: "^uU[a-z]+$"
    unicode: "^U[a-f0-9]+"
    number: "^R[0-9]+[.]?[0-9]*"
    calculator: "^cC.+"
    gregorian_to_lunar: "^N[0-9]{1,8}"

# 快捷键
key_binder:
  import_preset: default
  search: "`"
  bindings:
    # 翻译注释独立开关
    - {accept: "Control+Alt+E", toggle: show_english_annotation, when: always}
    - {accept: "Control+Alt+J", toggle: show_japanese_annotation, when: always}
    - {accept: "Control+Alt+F", toggle: japanese_fuzzy_match, when: always}
    - {accept: "Control+Alt+T", toggle: sentence_translation, when: always}
    # 翻页
    - {accept: bracketleft, send: Page_Up, when: has_menu}
    - {accept: bracketright, send: Page_Down, when: has_menu}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}

# 编辑器
editor:
  bindings:
    # space 不在这里定义，由 Lua processor 处理
    Return: commit_raw_input
    Control+Return: commit_script_text
    Control+Shift+Return: commit_comment
    BackSpace: revert
    Delete: delete
    Control+BackSpace: back_syllable
    Control+Delete: delete_candidate
    Escape: cancel

# 拼写设定
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    ### 日文模糊规则禁止放在全局 algebra。
    ### 全局变换会同时污染中文拼音；日语规则仅由 Lua 日语链处理。
    
    ### 超级简拼
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/        # 中文简拼：sbs → 是不是
    # Disabled for strict mixed-input matching: this abbreviation lets an
    # incomplete sho expand toward shou even when every correction is off.
    - abbrev/^([zcs]h).+$/$1/       # zh/ch/sh 作为一个声母
    
    ### v u 转换
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/
    
    ### 自动纠错（继承雾凇拼音的纠错规则）
    - derive/([zcs])h(a|e|i|u|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/
    - derive/([zcs])h([aeiu])$/$1$2h/
    - derive/^([wghk])ai$/$1ia/
    - derive/([wfghkz])ei$/$1ie/
    - derive/([jqx])ie$/$1ei/
    - derive/([rtypsdghklzcbnm])ao$/$1oa/
    - derive/([ypfm])ou$/$1uo/
    - derive/([wrtypsdfghklzcbnm])ang$/$1nag/
    - derive/([wrtypsdfghklzcbnm])ang$/$1agn/
    - derive/([wrtpsdfghklzcbnm])eng$/$1neg/
    - derive/([wrtpsdfghklzcbnm])eng$/$1egn/
    - derive/([qtypdjlxbnm])ing$/$1nig/
    - derive/([qtypdjlxbnm])ing$/$1ign/
    - derive/([rtysdghklzcn])ong$/$1nog/
    - derive/([rtysdghklzcn])ong$/$1ogn/
    - derive/([qtpdjlxbnm])iao$/$1ioa/
    - derive/([qtpdjlxbnm])iao$/$1oia/
    - derive/([rtsghkzc])ui$/$1iu/
    - derive/([qjlxnm])iu$/$1ui/
    - derive/([qjlxn])iang$/$1aing/
    - derive/([qjlxn])iang$/$1inag/
    - derive/([g|k|h|zh|sh])ua$/$1au/
    - derive/([g|h|k|zh|ch|sh])uai$/$1aui/
    - derive/([qrtysdghjklzxcn])uan$/$1aun/
    - derive/([nlyjqx])ue$/$1eu/
    - derive/([g|h|k|zh|ch|sh])uang$/$1aung/
    - derive/([g|h|k|zh|ch|sh])uang$/$1uagn/
    - derive/([g|h|k|zh|ch|sh])uang$/$1unag/
    - derive/([g|h|k|zh|ch|sh])uang$/$1augn/
    - derive/([jqx])iong$/$1inog/
    - derive/([jqx])iong$/$1oing/
    - derive/([jqx])iong$/$1iogn/
    - derive/([jqx])iong$/$1oign/
    - derive/([rtsdghkzc])o(u|ng)$/$1o/
    - derive/(.+)ong$/$1on/
    - derive/([tl])eng$/$1en/
    - derive/([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/

menu:
  # The expanded panel renders five rows (normally about 30 candidates).
  # Keeping 100 candidates live forced Rime, IPC and DirectWrite to rebuild
  # far more data than can be seen after every key and Backspace.
  page_size: 36
