# 日文多拼补充词库
# 常用完整表达：避免 nanno 被自动组句误判为姓氏「南野」。
なんの意味はない	nannoimiwanai	6000000
なんの意味はない	nannoimihanai	6000000
何の意味はない	nannoimiwanai	5900000
何の意味はない	nannoimihanai	5900000

# 助词「は」既可按字面读音 ha 输入，也可按助词实际读音 wa 输入。
# 两种拼法使用相同高权重，避免其中一种被普通同音词压到后面。
は	ha	5000000
は	wa	5000000

