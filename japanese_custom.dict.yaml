# 日文多拼补充词库
# 助词「は」既可按字面读音 ha 输入，也可按助词实际读音 wa 输入。
# 两种拼法使用相同高权重，避免其中一种被普通同音词压到后面。
は	ha	5000000
は	wa	5000000

# ち 系列
ち	ti
ちぇ	tie
ちゃ	tya
ちゅ	tyu
ちょ	tyo

# つ 系列
つ	tu

# し 系列
し	si
しゃ	sya
しゅ	syu
しょ	syo

# ふ 系列
ふ	hu

# じ 系列
じ	zi
じゃ	zya
じゅ	zyu
じょ	zyo

