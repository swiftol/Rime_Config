patch:
  "style/color_scheme": android
  # Per-language candidate colors (ABGR). Text defaults to Chinese white and
  # Japanese teal; transparent backgrounds continue to use the theme panel.
  "preset_color_schemes/android/chinese_candidate_text_color": 0xFFF2F2F2
  "preset_color_schemes/android/chinese_candidate_back_color": 0x00000000
  "preset_color_schemes/android/japanese_candidate_text_color": 0xFFC4CB80
  "preset_color_schemes/android/japanese_candidate_back_color": 0x00000000
  "style/display_tray_icon": true
  "style/horizontal": true
  "style/inline_preedit": false
  "style/layout/border": 0
  "style/layout/border_width": 0
  "style/layout/candidate_spacing": 16
  "style/layout/hilite_padding": 8
  "style/layout/hilite_spacing": 4
  "style/layout/margin_x": 8
  "style/layout/margin_y": 8
  "style/layout/max_height": 600
  "style/comment_below": true
  "style/comment_font_point": 11
  "style/layout/max_width": 0
  "style/layout/min_height": 0
  # 单行候选窗按当前候选内容自适应；最长候选决定宽度。
  "style/layout/min_width": 0
  "style/layout/round_corner": 4
  "style/layout/spacing": 8
